name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Manifest points only at files that exist, version matches
      # package.json, permissions match scripts/permissions.lock.json.
      - run: npm run verify
      - run: npm run package

      # Load-unpacked-ready build for every PR, so reviewers can try it.
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.sha }}
          path: release/*.zip
          retention-days: 14

  version-bump:
    # A PR that changes the shipped extension should bump the version,
    # otherwise the Web Store rejects the upload (versions must increase).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a version bump when extension code changes
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD -- \
            App.tsx index.tsx index.html index.css components hooks utils public)
          if [ -z "$changed" ]; then
            echo "No shipped files changed; no bump needed."
            exit 0
          fi
          old=$(git show "$base":public/manifest.json 2>/dev/null | jq -r .version || echo "0")
          new=$(jq -r .version public/manifest.json)
          echo "base version: $old, PR version: $new"
          if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ] || [ "$old" = "$new" ]; then
            echo "::warning::Extension files changed but version was not bumped ($old). Run 'npm version patch|minor|major' before releasing."
          fi
